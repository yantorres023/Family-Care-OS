name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.5'

defaults:
  run:
    working-directory: app

jobs:
  checks:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Test
        run: flutter test --reporter expanded

  android:
    name: Android build (APK + AAB)
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build APK (release, debug-signed)
        run: flutter build apk --release
      - name: Build App Bundle (release, debug-signed)
        run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            app/build/app/outputs/flutter-apk/app-release.apk
            app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

  ios:
    name: iOS build (no codesign)
    runs-on: macos-latest
    needs: checks
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Test (macOS)
        run: flutter test
      - name: Build iOS (release, unsigned)
        run: flutter build ios --release --no-codesign
      - name: Package unsigned app
        run: |
          cd build/ios/iphoneos
          zip -qr Runner-unsigned.zip Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned
          path: app/build/ios/iphoneos/Runner-unsigned.zip
          retention-days: 14
